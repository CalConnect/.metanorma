channels:
  - public/standards
  - public/directives
  - public/reports
  - public/admin
  - public/advisories
  - public/public-review
  - members/drafts
  - members/standards
  - internal/working
  - internal/tc

defaults:
  routing:
    rules:
      - stage: ["60"]
        channels: [public/standards]
      - stage: ["50"]
        channels: [members/drafts]
      - stage: ["20", "30", "40"]
        channels: [internal/working]
    default:
      - public/standards

display_categories:
  - name: Standards, Specifications & Reports
    slug: standards
    doctypes:
      - standard
      - specification
      - report
  - name: Guides & Advisories
    slug: guides-advisories
    doctypes:
      - guide
      - advisory
  - name: Directives
    slug: directives
    doctypes:
      - directive
  - name: Administrative
    slug: administrative
    doctypes:
      - administrative
  - name: Amendments & Technical Corrigenda
    slug: amendments
    doctypes:
      - amendment
      - technical-corrigendum
